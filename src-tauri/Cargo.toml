[package]
name = "voxen"
version = "0.13.0"
description = "Voxen masaüstü programı"
authors = ["Berk"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# Mesajdaki linkleri sistemin varsayılan tarayıcısında açmak için (izin: capabilities/default.json, yalnız http/https)
tauri-plugin-opener = "=2.7.2"
# Masaüstü bildirimleri (DM ve @bahsetme; src/notify.js, src/desktop.js). İzin: capabilities/default.json
tauri-plugin-notification = "=2.8.0"
# Windows açılışında başlat (Ayarlar > Bildirimler, varsayılan kapalı; src/desktop.js). İzin: capabilities/default.json
tauri-plugin-autostart = "=2.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# WebView2 olayları (izin istekleri, tam ekran) için; sürümler Tauri'nin kullandığıyla aynı
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 4
lto = false
strip = true
